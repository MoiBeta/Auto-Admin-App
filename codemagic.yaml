# Codemagic CI/CD — https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
#
# Variables que deben existir en Codemagic (grupo "auto_admin"):
#   AUTH_BASE_URL             URL base del auth-service
#   HABITS_BASE_URL           URL base del habit-service
#   FIREBASE_SERVICE_ACCOUNT  contenido del JSON de la service account (marcada como secreta)

workflows:
  android-app-distribution:
    name: Android · Firebase App Distribution
    max_build_duration: 30
    environment:
      flutter: 3.47.3
      groups:
        - auto_admin
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "*"
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Crear .env
        script: |
          cat > .env <<EOF
          AUTH_BASE_URL=$AUTH_BASE_URL
          HABITS_BASE_URL=$HABITS_BASE_URL
          EOF
      - name: Dependencias
        script: flutter pub get
      - name: Generar código (Riverpod)
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Análisis estático
        script: flutter analyze
      - name: Tests
        script: flutter test
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT
        android:
          # App de Firebase registrada para el paquete com.selfanvil.app
          app_id: 1:980242623902:android:7f250958a5cdade649fa8f
          groups:
            - Testers
          artifact_type: apk
